name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek model wajah
        run: |
          if [ ! -f android/app/src/main/assets/mobile_face_net.tflite ]; then
            echo "::error::Model wajah belum ada. Letakkan file MobileFaceNet float32 di android/app/src/main/assets/mobile_face_net.tflite (lihat README, bagian Model wajah)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: absensi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
